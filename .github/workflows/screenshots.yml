name: NetPulse Screenshots

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  screenshots:
    name: Capture screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare CI environment
        shell: bash
        run: |
          echo "ENVIRONMENT=test" >> "$GITHUB_ENV"
          echo "POSTGRES_DB=netpulse" >> "$GITHUB_ENV"
          echo "POSTGRES_USER=netpulse" >> "$GITHUB_ENV"
          echo "POSTGRES_PASSWORD=netpulse-ci-password" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql+psycopg2://netpulse:netpulse-ci-password@postgres:5432/netpulse" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=postgresql+psycopg2://netpulse:netpulse-ci-password@postgres:5432/netpulse_test" >> "$GITHUB_ENV"
          echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"
          echo "ALGORITHM=HS256" >> "$GITHUB_ENV"
          echo "ACCESS_TOKEN_EXPIRE_MINUTES=60" >> "$GITHUB_ENV"
          echo "CORRELATION_WORKER_ENABLED=false" >> "$GITHUB_ENV"

      - name: Install screenshot dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Start Docker services
        run: |
          docker compose up -d --build --wait --wait-timeout 180

      - name: Verify backend health
        run: |
          curl --fail \
            --retry 5 \
            --retry-delay 2 \
            http://localhost:8000/health

      - name: Capture screenshots
        run: |
          python backend/scripts/capture_screenshots.py

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: docs/screenshots
          if-no-files-found: error
          retention-days: 7

      - name: Show Docker diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail 200

      - name: Stop Docker services
        if: always()
        run: |
          docker compose down --volumes --remove-orphans

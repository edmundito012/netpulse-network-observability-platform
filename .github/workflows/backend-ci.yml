name: Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: netpulse_test
          POSTGRES_USER: netpulse
          POSTGRES_PASSWORD: netpulse-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U netpulse -d netpulse_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg2://netpulse:netpulse-ci-password@localhost:5432/netpulse_test
      TEST_DATABASE_URL: postgresql+psycopg2://netpulse:netpulse-ci-password@localhost:5432/netpulse_test
      SECRET_KEY: local-ci-secret-key-with-at-least-32-characters
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      MONITOR_INTERVAL_SECONDS: 30
      SNMP_INTERVAL_SECONDS: 60
      DASHBOARD_BROADCAST_INTERVAL_SECONDS: 5
      CORRELATION_WORKER_ENABLED: false
      PING_TIMEOUT_SECONDS: 2
      SNMP_PORT: 1161
      SNMP_TIMEOUT_SECONDS: 2
      SNMP_RETRIES: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.12.1

      - name: Verify lockfile
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --frozen --dev

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest

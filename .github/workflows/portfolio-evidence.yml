name: Portfolio Evidence

on:
  push:
    branches:
      - "feat/**"
      - "fix/**"
      - "refactor/**"
      - "docs/**"
    paths-ignore:
      - "README.md"
      - "docs/screenshots/**"
      - "docs/evidence/**"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-portfolio-evidence:
    name: Tests, Screenshots and README
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare CI environment
        shell: bash
        run: |
          echo "ENVIRONMENT=test" >> "$GITHUB_ENV"
          echo "POSTGRES_DB=netpulse" >> "$GITHUB_ENV"
          echo "POSTGRES_USER=netpulse" >> "$GITHUB_ENV"
          echo "POSTGRES_PASSWORD=netpulse-ci-password" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql+psycopg2://netpulse:netpulse-ci-password@postgres:5432/netpulse" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=postgresql+psycopg2://netpulse:netpulse-ci-password@postgres:5432/netpulse_test" >> "$GITHUB_ENV"
          echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" >> "$GITHUB_ENV"
          echo "ALGORITHM=HS256" >> "$GITHUB_ENV"
          echo "ACCESS_TOKEN_EXPIRE_MINUTES=60" >> "$GITHUB_ENV"
          echo "CORRELATION_WORKER_ENABLED=false" >> "$GITHUB_ENV"

      - name: Install locked development dependencies
        run: |
          python -m pip install uv==0.12.1
          uv lock --check --directory backend
          uv sync --frozen --all-groups --directory backend

      - name: Install Chromium
        run: |
          uv run \
            --directory backend \
            --group e2e \
            playwright install --with-deps chromium

      - name: Start NetPulse
        run: |
          docker compose up \
            -d \
            --build \
            --wait \
            --wait-timeout 180

      - name: Verify backend health
        run: |
          curl \
            --fail \
            --retry 5 \
            --retry-delay 2 \
            http://localhost:8000/health

      - name: Create test database
        run: |
          docker compose exec -T postgres \
            psql \
            -U "${POSTGRES_USER}" \
            -d "${POSTGRES_DB}" \
            -c "CREATE DATABASE netpulse_test;"

      - name: Apply test database migrations
        env:
          DATABASE_URL: postgresql+psycopg2://netpulse:netpulse-ci-password@localhost:5433/netpulse_test
          TEST_DATABASE_URL: postgresql+psycopg2://netpulse:netpulse-ci-password@localhost:5433/netpulse_test
        run: |
          uv run \
            --directory backend \
            alembic upgrade head

      - name: Run automated tests
        shell: bash
        env:
          DATABASE_URL: postgresql+psycopg2://netpulse:netpulse-ci-password@localhost:5433/netpulse_test
          TEST_DATABASE_URL: postgresql+psycopg2://netpulse:netpulse-ci-password@localhost:5433/netpulse_test
        run: |
          set -o pipefail

          mkdir -p docs/evidence

          uv run \
            --directory backend \
            pytest \
            | tee docs/evidence/latest-tests.txt

      - name: Capture screenshots
        run: |
          backend/.venv/bin/python \
            backend/scripts/capture_screenshots.py

      - name: Update README
        run: |
          backend/.venv/bin/python \
            backend/scripts/update_readme.py

      - name: Show generated changes
        run: |
          git status --short
          git diff -- README.md || true

      - name: Commit generated evidence
        shell: bash
        run: |
          if git diff --quiet && \
             git diff --cached --quiet && \
             [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No portfolio evidence changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            README.md \
            docs/screenshots \
            docs/evidence

          git commit -m \
            "docs(portfolio): update automated evidence [skip readme-sync]"

          git push origin HEAD:${{ github.ref_name }}

      - name: Upload portfolio artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: netpulse-portfolio-evidence
          path: |
            docs/screenshots
            docs/evidence/latest-tests.txt
          if-no-files-found: error
          retention-days: 14

      - name: Show Docker diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail 200

      - name: Stop NetPulse
        if: always()
        run: |
          docker compose down --volumes --remove-orphans

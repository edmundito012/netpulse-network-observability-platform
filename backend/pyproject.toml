[project]
name = "netpulse"
version = "0.5.0"
description = "Network observability platform built with FastAPI and PostgreSQL."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.18.4",
    "apscheduler==3.11.2",
    "bcrypt==4.0.1",
    "cryptography==48.0.0",
    "email-validator==2.3.0",
    "fastapi==0.136.1",
    "passlib==1.7.4",
    "ping3==5.1.5",
    "prometheus-client==0.26.0",
    "psycopg2-binary==2.9.12",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "pysnmp==7.1.26",
    "python-dotenv==1.2.2",
    "python-jose==3.5.0",
    "python-multipart==0.0.28",
    "requests==2.34.2",
    "sqlalchemy==2.0.49",
    "uvicorn[standard]==0.46.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy>=2.3.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]
e2e = [
    "playwright==1.62.0",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
